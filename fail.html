<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="description" content="DENIQ AI 원데이클래스 수강 신청 결제 실패 안내">
  <title>결제 실패 · DENIQ AI 원데이클래스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./landing.css">
  <link rel="stylesheet" href="./shop.css">
</head>
<body>
  <main class="result-shell">
    <section class="result-card" aria-labelledby="result-title">
      <p class="pay-eyebrow">PAYMENT FAILED · 결제 미완료</p>
      <h1 id="result-title">결제를 마치지<br>못했습니다</h1>
      <p>아래 사유를 확인하고 다시 시도해주세요. 결제가 중복으로 청구된 경우 고객센터로 알려주시면 바로 확인해 드립니다.</p>

      <div class="result-receipt">
        <dl>
          <div><dt>사유</dt><dd data-message>결제가 취소되었거나 승인되지 않았습니다.</dd></div>
          <div><dt>오류 코드</dt><dd data-code>-</dd></div>
          <div><dt>주문번호</dt><dd data-order-id>-</dd></div>
        </dl>
      </div>

      <div class="result-actions">
        <a class="button button-primary" href="./index.html#pay">다시 결제하기</a>
        <a class="button button-quiet" href="./index.html">수업 소개로 돌아가기</a>
      </div>

      <p class="pay-note">고객센터 010-9702-1213 · cheeuuuuu@gmail.com (주식회사 대성컨템포러리)</p>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const put = (selector, value) => {
      const node = document.querySelector(selector);
      if (node && value) node.textContent = value;
    };
    put("[data-message]", params.get("message"));
    put("[data-code]", params.get("code"));
    put("[data-order-id]", params.get("orderId"));
  </script>
</body>
</html>
